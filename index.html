<style>
:root{
  --velvet:#140b24; --velvet-2:#1f1235; --velvet-3:#2a1844; --seam:#3a2656; --seam-2:#54397a;
  --text:#f6eefe; --haze:#b7a6cf; --tungsten:#ffcf8a; --tungsten-ink:#2a1600; --tungsten-glow:rgba(255,207,138,.35);
  --pink:#ff3fa4; --cyan:#3fd0ff;
  --display:"Unbounded", system-ui, sans-serif;
  --body:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-s:8px; --r-m:14px;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--velvet);color:var(--text);font:400 17px/1.6 var(--body);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--tungsten);outline-offset:3px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
h1,h2,h3{font-family:var(--display);line-height:1.08;margin:0;letter-spacing:-.01em}
h2{font-size:clamp(1.7rem,3.4vw,2.5rem);font-weight:700}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}

/* ===== Đầu trang ===== */
.top{position:fixed;inset:0 0 auto;z-index:20;transition:background .3s var(--ease),border-color .3s}
.top .wrap{display:flex;align-items:center;gap:20px;height:64px}
.top.solid{background:rgba(20,11,36,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--seam)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:700 1.02rem var(--display)}
.brand img{width:30px;height:30px}
.top nav{display:flex;gap:22px;margin-left:auto}
.top nav a{text-decoration:none;color:var(--haze);font-weight:600;font-size:.95rem}
.top nav a:hover{color:var(--text)}
.lang{display:flex;border:1px solid var(--seam-2);border-radius:999px;padding:3px;background:rgba(20,11,36,.5)}
.lang button{font:700 .78rem var(--body);color:var(--haze);background:none;border:0;border-radius:999px;padding:5px 11px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--text);color:var(--velvet)}

/* ===== Sân khấu: đèn thật của ứng dụng ===== */
#stage{position:fixed;inset:0;z-index:0;pointer-events:none}
#stage canvas{position:absolute;inset:0;width:100%;height:100%}
.hero{position:relative;z-index:1;min-height:100svh;display:flex;align-items:flex-end;padding:120px 0 64px;
  background:var(--velvet) center/cover no-repeat;background-image:var(--hero-still)}
html.live .hero{background:transparent}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(70% 80% at 12% 88%,rgba(20,11,36,.92),rgba(20,11,36,.55) 45%,transparent 75%)}
.hero .wrap{position:relative;width:100%}
.hero-copy{max-width:780px}
.release{color:var(--haze);font-size:.95rem;margin-bottom:18px}
.hero h1{font-size:clamp(2.4rem,6vw,4.8rem);font-weight:800;line-height:1.02;letter-spacing:-.025em;text-wrap:balance}
.lede{margin-top:20px;font-size:1.12rem;color:#e6dbf5;max-width:58ch}
.cta{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;margin-top:30px}
.btn{display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px;text-decoration:none;border-radius:var(--r-m);
  padding:14px 22px;font-weight:700;transition:transform .15s var(--ease),box-shadow .2s}
.btn-main{background:var(--tungsten);color:var(--tungsten-ink);box-shadow:0 0 0 0 var(--tungsten-glow)}
.btn-main:hover{transform:translateY(-1px);box-shadow:0 10px 40px -6px var(--tungsten-glow)}
.btn-main .big{font:700 1.08rem var(--display)}
.btn-main .small{font-weight:600;font-size:.84rem;opacity:.75}
.link{color:var(--text);font-weight:600;text-underline-offset:4px}
.mobile-note{display:none;margin-top:24px;padding:14px 16px;border:1px solid var(--seam-2);border-radius:var(--r-m);background:rgba(31,18,53,.8);color:#e6dbf5;max-width:52ch}
html.mobile .mobile-note{display:block}
html.mobile .cta .btn-main{display:none}

.try{margin-top:34px;display:none}
html.live .try{display:block}
.try p{font-size:.92rem;color:var(--haze);margin-bottom:10px}
.try p b{color:var(--text);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{font:600 .86rem var(--body);color:var(--text);background:rgba(31,18,53,.55);border:1px solid var(--seam-2);
  border-radius:999px;padding:6px 13px;cursor:pointer;backdrop-filter:blur(6px)}
.chips button:hover{border-color:var(--haze)}
.chips button[aria-pressed="true"]{background:var(--text);color:var(--velvet);border-color:var(--text)}
.chips .drop{border-color:rgba(255,63,164,.7);background:rgba(255,63,164,.18)}

/* Các phần dưới phủ nền kín để che sân khấu cố định */
main > section:not(.hero), footer{position:relative;z-index:1;background:var(--velvet)}
.sec{padding:96px 0}
.sec-head{max-width:640px;margin-bottom:44px}
.sec-head p{margin-top:14px;color:var(--haze);font-size:1.05rem}

/* ===== Ba bước ===== */
.steps{border-top:1px solid var(--seam);padding:56px 0}
.steps ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:28px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:baseline}
.steps li::before{content:counter(s);grid-row:span 2;font:800 2.6rem/1 var(--display);color:transparent;-webkit-text-stroke:1.4px var(--tungsten)}
.steps b{font:700 1.05rem var(--display)}
.steps span{color:var(--haze)}

/* ===== Thẻ tải dạng vé ===== */
.tickets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;align-items:start}
.ticket{position:relative;min-width:0;background:var(--velvet-2);border-radius:var(--r-m);
  -webkit-mask:radial-gradient(circle 13px at 0 var(--cut),#0000 98%,#000) left/51% 100% no-repeat,
               radial-gradient(circle 13px at 100% var(--cut),#0000 98%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 13px at 0 var(--cut),#0000 98%,#000) left/51% 100% no-repeat,
               radial-gradient(circle 13px at 100% var(--cut),#0000 98%,#000) right/51% 100% no-repeat;
  --cut:186px}
.ticket.mine{background:linear-gradient(180deg,var(--velvet-3),var(--velvet-2))}
.ticket .stub{padding:26px 26px 22px;height:186px;display:flex;flex-direction:column}
.os{display:flex;align-items:center;gap:12px}
.os svg{width:28px;height:28px;fill:var(--text)}
.os h3{font-size:1.35rem}
.mine-tag{margin-left:auto;font-size:.78rem;font-weight:700;color:var(--tungsten-ink);background:var(--tungsten);border-radius:999px;padding:3px 10px;display:none}
.ticket.mine .mine-tag{display:inline-block}
.req{color:var(--haze);font-size:.93rem;margin-top:10px}
.ticket .btn-main{margin-top:auto;align-self:stretch;align-items:center;text-align:center}
.tear{border-top:2px dashed var(--seam-2);margin:0 18px}
.ticket .body{padding:20px 26px 26px}
.file{font-size:.86rem;color:var(--haze);word-break:break-all}
.count{font-size:.86rem;color:var(--haze);margin-top:4px;min-height:1.4em}
.ticket ol{margin:18px 0 0;padding-left:1.2em;display:grid;gap:10px;font-size:.95rem}
.ticket ol li::marker{color:var(--tungsten);font-weight:700}
.ticket ol li{min-width:0}
.note{display:block;color:var(--haze);font-size:.86rem;margin-top:3px}
.cmd{margin-top:14px;min-width:0;display:flex;align-items:stretch;border:1px solid var(--seam-2);border-radius:var(--r-s);overflow:hidden;background:#0f0820}
.cmd code{flex:1;min-width:0;padding:10px 12px;font:500 .8rem/1.5 ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;color:#e6dbf5;overflow-x:auto;white-space:nowrap}
.cmd button{font:700 .8rem var(--body);color:var(--text);background:var(--velvet-3);border:0;border-left:1px solid var(--seam-2);padding:0 14px;cursor:pointer}
.cmd button:hover{background:var(--seam)}

/* ===== Lưới các cảnh ===== */
.scenes{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.scene{margin:0;position:relative;border-radius:var(--r-s);overflow:hidden;background:#000;aspect-ratio:16/9}
.scene img{width:100%;height:100%;object-fit:cover}
.scene figcaption{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 10px;font-weight:600;font-size:.92rem;
  background:linear-gradient(transparent,rgba(10,5,20,.85))}
.scene button{all:unset;position:absolute;inset:0;cursor:pointer;display:none}
html.live .scene button{display:block}
.scene button:focus-visible{outline:2px solid var(--tungsten);outline-offset:-2px}
html.live .scene:hover img{filter:brightness(1.15)}
.scenes-note{margin-top:16px;color:var(--haze);font-size:.92rem;display:none}
html.live .scenes-note{display:block}

/* ===== Tính năng ===== */
.feat{display:grid;grid-template-columns:1fr 360px;gap:64px;align-items:center}
.feat dl{margin:0;display:grid;gap:26px}
.feat dt{font:700 1.08rem var(--display)}
.feat dd{margin:6px 0 0;color:var(--haze);max-width:52ch}
.feat kbd{font:600 .85em var(--body);border:1px solid var(--seam-2);border-bottom-width:2px;border-radius:6px;padding:0 6px;color:var(--text)}
.panel-shot{filter:drop-shadow(0 30px 60px rgba(0,0,0,.55))}
.panel-shot img{width:360px;height:auto}
:root[lang="en"] .panel-shot .vi, :root:not([lang="en"]) .panel-shot .en{display:none}

/* ===== Riêng tư ===== */
.priv{border-top:1px solid var(--seam)}
.priv ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.priv li b{display:block;font:700 1.02rem var(--display);margin-bottom:6px}
.priv li span{color:var(--haze)}

footer{border-top:1px solid var(--seam);padding:34px 0 40px;color:var(--haze);font-size:.92rem}
footer .wrap{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
footer p{display:flex;align-items:center;gap:10px}

/* Hình chìm huy hiệu FRANK như trang claude-monitor. Các phần dưới có nền kín để che lớp đèn,
   nên đặt hình chìm phía trên và hòa màu "screen": chỉ làm sáng nền tối, gần như không đổi chữ sáng. */
.page-mark{position:fixed;inset:0;z-index:2;overflow:hidden;pointer-events:none;opacity:.14;mix-blend-mode:screen}
.page-mark>div{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);line-height:0}
.page-mark frank-badge{--size:min(120vmin,1100px)!important}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;z-index:30;background:var(--text);color:var(--velvet);
  font-weight:700;padding:10px 18px;border-radius:999px;transition:all .25s var(--ease);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1000px){
  .tickets{grid-template-columns:minmax(0,1fr);max-width:560px}
  .scenes{grid-template-columns:repeat(3,1fr)}
  .feat{grid-template-columns:1fr;gap:40px}
  .panel-shot{justify-self:start}
  .priv ul, .steps ol{grid-template-columns:1fr}
}
@media (max-width:640px){
  body{font-size:16px}
  .top nav{display:none}
  .lang{margin-left:auto}
  .scenes{grid-template-columns:repeat(2,1fr)}
  .sec{padding:72px 0}
  .wrap{padding:0 16px}
  .panel-shot img{width:300px}
}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  .btn,.toast,.top{transition:none}
}
</style>

<script type="text/x-disco-engine" id="engine">
'use strict';
// Trạng thái cho bản chạy thử (CI): 'ok' sau khung hình đầu vẽ không lỗi
window.__dvtStatus = '';
addEventListener('error', e => { window.__dvtStatus = 'error: ' + e.message; });
/* Lớp đèn Disco Lights.
 * - WebGL (một shader): khói, chùm đèn moving-head, laser quạt, đường hầm laser, bầu trời laser,
 *   đèn rọi gobo, cực quang, tia quả cầu, chấm quả cầu, đèn khán đài, viền màn hình, quả cầu.
 * - Canvas 2D "rig" (dưới): giàn đèn, đầu đèn, hộp laser, đèn khán đài.
 * - Canvas 2D "fx" (trên): pháo giấy, tia lửa, cột sóng LED.
 * Nhịp lấy từ tiếng loa (xem phần Phân tích âm thanh). */
const PI = Math.PI, TAU = PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const lerp = (a, b, k) => a + (b - a) * k;

const opt = { scene: 'auto', palette: 'neon', bright: 0.7, fog: 0.6, truss: true, ball: true, strobe: true, fps: 30, musicOnly: true };

/* ================= WebGL ================= */
const glc = document.getElementById('gl');
const gl = glc.getContext('webgl', { premultipliedAlpha: true, alpha: true, antialias: false });
// Mất WebGL (driver lỗi, đổi card màn hình…): tải lại lớp đèn, main gửi lại cài đặt và trạng thái
glc.addEventListener('webglcontextlost', e => { e.preventDefault(); setTimeout(() => location.reload(), 1500); });

const VS = 'attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }';
const FS = `
precision highp float;
uniform vec2 uRes, uView;
uniform float uTime, uFog, uExposure, uStrobe, uMaster;
uniform int uNB;
uniform vec4 uBeam[12];   // gốc x, y, góc, cường độ
uniform vec4 uBeamP[12];  // tan(độ mở), gobo, góc gobo, -
uniform vec3 uBeamC[12];
uniform vec4 uL1, uL2;    // laser quạt: gốc x, y, góc, cường độ
uniform vec3 uLP;         // độ mở, số tia, rung
uniform vec3 uLC;
uniform vec4 uT1, uT2;    // đường hầm laser: tâm x, y, góc xoay, cường độ
uniform vec3 uTP;
uniform vec3 uTC1, uTC2;
uniform vec4 uSky;        // bầu trời laser: cường độ, vị trí y (tỉ lệ), biên độ sóng, tốc độ
uniform vec3 uSkyC;
uniform vec4 uBall;       // x, y, bán kính, góc xoay
uniform vec3 uBallI;      // thân quả cầu, chấm sáng, tia từ quả cầu
uniform vec3 uBallC;
uniform vec4 uSpot[6];    // đèn rọi gobo: x, y, bán kính, cường độ
uniform float uSpotRot;
uniform vec3 uPal[6];     // bảng màu đang dùng
uniform vec2 uAur;        // cực quang: cường độ, lệch màu
uniform vec4 uEdge;       // viền màn hình: màu, cường độ
uniform vec3 uBlind;      // đèn khán đài: cường độ, y, số đèn
uniform vec3 uWash;

float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  float a = hash(i), b = hash(i + vec2(1.0, 0.0)), c = hash(i + vec2(0.0, 1.0)), d = hash(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
float fbm(vec2 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 4; i++){ v += a * noise(p); p = p * 2.03 + vec2(17.1, 9.2); a *= 0.5; } return v; }

// GLSL ES 1.0 không cho chỉ số mảng tùy ý: chọn màu bằng vòng lặp
vec3 palCol(float k){
  float m = mod(floor(k + 0.5), 6.0);
  vec3 c = uPal[0];
  for (int i = 1; i < 6; i++){ if (float(i) == m) c = uPal[i]; }
  return c;
}

// Quạt tia laser từ một gốc; P = (độ mở, số tia, rung). Trả về độ sáng (nhân màu ở ngoài).
float laserFan(vec2 p, vec4 L, vec3 P, float fog){
  if (L.w < 0.001) return 0.0;
  float c = 0.0;
  int n = int(P.y);
  for (int k = 0; k < 24; k++){
    if (k >= n) break;
    float fk = n > 1 ? float(k) / float(n - 1) - 0.5 : 0.0;
    float a = L.z + fk * P.x + sin(uTime * 2.7 + float(k) * 1.3) * P.z;
    vec2 d = vec2(cos(a), sin(a)); vec2 v = p - L.xy; float al = dot(v, d);
    if (al > 0.0){
      float pe = abs(d.x * v.y - d.y * v.x);
      c += (exp(-pe * pe * 1.1) * 1.5 + exp(-pe * 0.25) * 0.16) * (0.3 + 0.95 * fog) * (1.0 - smoothstep(1300.0, 2600.0, al));
    }
  }
  float r = length(p - L.xy);
  c += exp(-r * r / 50.0) * 3.0 + exp(-r / 26.0) * 0.35;
  return c * L.w;
}

void main(){
  vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y) * (uView.x / uRes.x);
  float t = uTime;

  vec2 q = p * 0.0021;
  float f1 = fbm(q * vec2(1.0, 1.7) + vec2(t * 0.035, -t * 0.012));
  float f2 = fbm(q * 2.4 + vec2(-t * 0.05, t * 0.02) + f1 * 1.5);
  float fog = mix(1.0, 0.15 + 1.7 * smoothstep(0.22, 0.78, f2), uFog);

  vec3 col = vec3(0.0);

  // ===== Cực quang (nằm sau cùng) =====
  if (uAur.x > 0.001){
    vec2 ap = p / uView.y;
    float n1 = fbm(vec2(ap.x * 1.6 + t * 0.05, t * 0.04));
    float curtain = 0.5 + 0.5 * noise(vec2(p.x * 0.016 + n1 * 3.0, t * 0.35));
    for (int k = 0; k < 2; k++){
      float fk = float(k);
      float yc = 0.2 + 0.17 * fk + 0.09 * sin(ap.x * (2.2 + fk) + t * (0.25 + 0.1 * fk) + n1 * 4.0);
      float dy = ap.y - yc;
      float band = exp(-dy * dy / ((0.06 + 0.03 * fk) * (0.06 + 0.03 * fk)));
      float drape = dy > 0.0 ? exp(-dy / 0.2) * 0.45 : 0.0;
      vec3 ac = mix(palCol(fk * 2.0 + uAur.y), palCol(fk * 2.0 + 1.0 + uAur.y), n1);
      col += ac * (band + drape) * curtain * uAur.x;
    }
  }

  // ===== Chùm đèn moving-head =====
  for (int i = 0; i < 12; i++){
    if (i >= uNB) break;
    vec4 b = uBeam[i]; vec4 bp = uBeamP[i]; vec3 bc = uBeamC[i];
    if (b.w < 0.002) continue;
    vec2 d = vec2(cos(b.z), sin(b.z));
    vec2 v = p - b.xy; float al = dot(v, d);
    if (al > 0.0){
      float pe = d.x * v.y - d.y * v.x;
      float hw = 2.5 + al * bp.x;
      float r = pe / hw;
      float edge = exp(-r * r * mix(2.4, 1.3, bp.y));
      float core = exp(-r * r * 16.0);
      float gob = 0.1 + 0.9 * pow(0.5 + 0.5 * cos(r * 4.0 * 3.14159 + bp.z), 4.0);
      gob = mix(1.0, gob, bp.y * smoothstep(10.0, 160.0, al));
      float att = 1.0 / (1.0 + al * al * 0.0000022);
      float I = b.w * (edge * 0.5 * gob + core * 0.55 * (1.0 - 0.6 * bp.y)) * att;
      col += bc * I * fog;
      if (d.y > 0.12){
        float tt = (uView.y - b.y) / d.y;
        float hx = b.x + d.x * tt;
        float rx = (2.5 + tt * bp.x) / d.y * 1.1;
        vec2 sp = vec2((p.x - hx) / rx, (uView.y - p.y) / 16.0);
        col += bc * b.w * exp(-dot(sp, sp)) * 0.6 * gob;
      }
    }
    vec2 fo = p - b.xy; float rr = length(fo);
    col += bc * b.w * (exp(-rr * rr / 40.0) * 3.0 + exp(-rr / 22.0) * 0.4);
    col += mix(bc, vec3(1.0), 0.6) * b.w * exp(-abs(fo.y) / 1.5) * exp(-abs(fo.x) / 36.0) * 0.45;
  }

  // ===== Tia màu bắn ra từ quả cầu gương =====
  if (uBallI.z > 0.001){
    for (int k = 0; k < 24; k++){
      float fk = float(k);
      float a = uBall.w * 1.3 + fk * 0.2618;
      vec2 d = vec2(cos(a), sin(a)); vec2 v = p - uBall.xy;
      float al = dot(v, d) - uBall.z;
      if (al > 0.0){
        float pe = abs(d.x * v.y - d.y * v.x);
        float w = 1.2 + al * 0.012;
        float I = exp(-pe * pe / (w * w)) / (1.0 + al * 0.002);
        col += palCol(fk) * I * uBallI.z * (0.35 + 0.8 * fog) * (0.55 + 0.45 * sin(t * 3.0 + fk * 2.1)) * 0.6;
      }
    }
  }

  // ===== Laser quạt =====
  col += uLC * (laserFan(p, uL1, uLP, fog) + laserFan(p, uL2, uLP, fog));

  // ===== Đường hầm laser: hai vòng tia xoay ngược chiều =====
  col += uTC1 * laserFan(p, uT1, uTP, fog) + uTC2 * laserFan(p, uT2, uTP, fog);

  // ===== Bầu trời laser: tấm laser gợn sóng, khói phía trên tấm phát sáng =====
  if (uSky.x > 0.001){
    for (int k = 0; k < 3; k++){
      float fk = float(k);
      float yk = uView.y * (uSky.y + 0.085 * fk) + uSky.z * sin(p.x * 0.0035 + t * uSky.w + fk * 1.7)
               + 14.0 * sin(p.x * 0.011 - t * 1.3 * uSky.w + fk);
      float dy = p.y - yk;
      float line = exp(-dy * dy * 0.5) * 1.2 + exp(-abs(dy) * 0.07) * 0.1;
      float sheet = dy < 0.0 ? exp(dy / 110.0) * 0.16 : 0.0;
      col += uSkyC * uSky.x * (line + sheet * (0.4 + 1.2 * fog)) * (0.75 - 0.15 * fk);
    }
  }

  // ===== Đèn rọi gobo trên màn =====
  for (int i = 0; i < 6; i++){
    vec4 s = uSpot[i];
    if (s.w < 0.002) continue;
    vec2 v = p - s.xy; float r = length(v) / s.z;
    if (r < 1.6){
      float ang = atan(v.y, v.x);
      float dir = mod(float(i), 2.0) * 2.0 - 1.0;
      float rot = uSpotRot * dir;
      float pat = 0.2 + 0.8 * pow(0.5 + 0.5 * cos(ang * 5.0 + rot), 2.0);
      pat *= 0.65 + 0.35 * cos(r * 9.0 - rot * 1.5);
      pat = mix(pat, 1.0, smoothstep(0.25, 0.0, r));
      float disk = smoothstep(1.0, 0.92, r);
      col += palCol(float(i)) * s.w * (disk * pat * 1.1 + exp(-r * r * 1.5) * 0.18);
    }
  }

  // ===== Chấm sáng quả cầu gương =====
  if (uBallI.y > 0.001){
    float rows = 24.0;
    vec2 g = p / uView.y * rows;
    float row = floor(g.y);
    float lat = (row + 0.5) / rows * 2.0 - 1.0;
    float spd = 1.0 - 0.45 * lat * lat;
    float xs = g.x + uBall.w * rows * 0.35 * spd + hash(vec2(row, 3.7)) * 50.0;
    vec2 cell = vec2(floor(xs), row);
    float h = hash(cell);
    if (h > 0.42){
      vec2 fr = vec2(fract(xs), fract(g.y));
      vec2 c = vec2(0.2 + 0.6 * hash(cell + 7.1), 0.2 + 0.6 * hash(cell + 3.3));
      vec2 dd = (fr - c) * vec2(0.85, 1.15);
      float sz = 0.045 + 0.07 * hash(cell + 11.0);
      float dot1 = exp(-dot(dd, dd) / (sz * sz));
      float tw = 0.55 + 0.45 * sin(t * 5.0 + h * 60.0);
      vec3 dc = mix(uBallC, vec3(1.0), 0.55 * hash(cell + 2.0));
      col += dc * uBallI.y * dot1 * tw * 1.7 * (0.65 + 0.45 * fog);
    }
  }

  // ===== Đèn khán đài (blinder): bóng trắng ấm, lóa ngang =====
  if (uBlind.x > 0.001){
    int nb = int(uBlind.z);
    for (int k = 0; k < 6; k++){
      if (k >= nb) break;
      float x = uView.x * (float(k) + 1.0) / (uBlind.z + 1.0);
      for (int j = 0; j < 2; j++){
        vec2 fo = p - vec2(x + (float(j) - 0.5) * 22.0, uBlind.y);
        float rr = length(fo);
        col += vec3(1.0, 0.82, 0.55) * uBlind.x * (exp(-rr * rr / 60.0) * 4.0 + exp(-rr / 70.0) * 0.55
             + exp(-abs(fo.y) / 2.0) * exp(-abs(fo.x) / 140.0) * 0.6);
      }
    }
    col += vec3(1.0, 0.85, 0.6) * uBlind.x * 0.07 * exp(-p.y / 420.0);
  }

  float by = uView.y - p.y;
  col += uWash * (exp(-by / 130.0) * 0.9 + exp(-p.y / 280.0) * 0.22) * (0.5 + 0.6 * fog);

  // ===== Viền màn hình sáng theo bass =====
  if (uEdge.w > 0.001){
    float de = min(min(p.x, uView.x - p.x), min(p.y, uView.y - p.y));
    col += uEdge.rgb * uEdge.w * (exp(-de / 22.0) * 0.9 + exp(-de / 90.0) * 0.25);
  }

  // ===== Quả cầu gương =====
  float ballMask = 0.0;
  if (uBallI.x > 0.001){
    vec2 bv = (p - uBall.xy) / uBall.z; float bl = length(bv);
    if (bl < 1.0){
      vec3 n = vec3(bv.x, -bv.y, sqrt(1.0 - bl * bl));
      float latb = asin(n.y);
      float lon = atan(n.x, n.z) + uBall.w;
      float rowsB = 12.0;
      float fy = latb / 3.14159 * rowsB + 0.5 * rowsB;
      float ry = floor(fy);
      float cnt = max(5.0, floor(2.0 * rowsB * cos(((ry + 0.5) / rowsB - 0.5) * 3.14159)));
      float fx = lon / 6.28318 * cnt;
      vec2 fid = vec2(floor(fx), ry);
      vec2 ff = vec2(fract(fx), fract(fy));
      float e = smoothstep(0.0, 0.14, ff.x) * smoothstep(1.0, 0.86, ff.x) * smoothstep(0.0, 0.14, ff.y) * smoothstep(1.0, 0.86, ff.y);
      float hb = hash(fid);
      float spark = pow(hash(fid + floor(t * 7.0 + hb * 7.0)), 14.0) * 4.0;
      vec3 base = vec3(0.5, 0.52, 0.6) * (0.2 + 0.8 * n.z) * (0.35 + 0.7 * hb);
      vec3 bcol = (base + uBallC * 0.45 * hash(fid + 5.0) * (0.4 + uBallI.y + uBallI.z) + vec3(spark)) * e + vec3(0.03) * (1.0 - e);
      float m = smoothstep(1.0, 0.96, bl) * uBallI.x;
      col = mix(col, bcol, m);
      ballMask = m;
    } else {
      col += mix(uBallC, vec3(1.0), 0.5) * uBallI.x * (0.15 + 0.5 * uBallI.y + 0.6 * uBallI.z) * exp(-(bl - 1.0) * 5.0) * 0.5;
    }
  }

  col += vec3(uStrobe);

  col = vec3(1.0) - exp(-col * uExposure);
  col += (hash(gl_FragCoord.xy + fract(t) * 91.0) - 0.5) / 255.0;
  col = max(col, 0.0);
  float a = clamp(max(col.r, max(col.g, col.b)) * 1.15, 0.0, 1.0);
  a = max(a, ballMask) * uMaster;
  gl_FragColor = vec4(min(col * uMaster, vec3(a)), a);
}`;

function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const aLoc = gl.getAttribLocation(prog, 'a');
gl.enableVertexAttribArray(aLoc);
gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);
const U = {};
['uRes', 'uView', 'uTime', 'uFog', 'uExposure', 'uStrobe', 'uMaster', 'uNB', 'uBeam[0]', 'uBeamP[0]', 'uBeamC[0]',
 'uL1', 'uL2', 'uLP', 'uLC', 'uT1', 'uT2', 'uTP', 'uTC1', 'uTC2', 'uSky', 'uSkyC',
 'uBall', 'uBallI', 'uBallC', 'uSpot[0]', 'uSpotRot', 'uPal[0]', 'uAur', 'uEdge', 'uBlind', 'uWash',
].forEach(n => U[n] = gl.getUniformLocation(prog, n));

/* ================= Kích thước & hiệu năng ================= */
const rig = document.getElementById('rig'), rctx = rig.getContext('2d');
const fxc = document.getElementById('fx'), fctx = fxc.getContext('2d');
let W = 0, H = 0, quality = 1;
function resize() {
  W = innerWidth; H = innerHeight;
  const g = Math.min(devicePixelRatio || 1, 1.25) * quality;
  glc.width = Math.round(W * g); glc.height = Math.round(H * g);
  gl.viewport(0, 0, glc.width, glc.height);
  const r = Math.min(devicePixelRatio || 1, 2);
  for (const [c, x] of [[rig, rctx], [fxc, fctx]]) { c.width = W * r; c.height = H * r; x.setTransform(r, 0, 0, r, 0, 0); }
  layoutFixtures(true);
}

/* ================= Sân khấu ================= */
const PALETTES = {
  neon:   [[1, .1, .55], [.1, .75, 1], [.6, .2, 1], [1, .75, .1], [.15, 1, .55], [1, .35, .1]],
  purple: [[.6, .25, 1], [.15, .5, 1], [.85, .3, 1], [.1, .85, 1]],

/* Mỗi cảnh: nhóm năng lượng (calm | mid | high) để chọn theo nhạc, độ sáng của từng lớp hiệu ứng (L),

const SCENES = {

  gobo:    { energy: 'calm', L: { beam: .95, gobo: 1, aurora: .2 },

  laser:   { energy: 'high', L: { beam: .3, laser: 1, edge: .35 }, lasers: ['single', 'dual'],

  ball:    { energy: 'calm', L: { beam: .45, dots: 1, rays: 1 },

  drop:    { energy: 'high', L: { beam: 1.25, laser: .85, dots: .5, blind: 1, edge: .8, eq: .55 }, lasers: ['single', 'dual'], confetti: true,

  spots:   { energy: 'mid',  L: { beam: .7, spots: 1 },

  wall:    { energy: 'high', L: { beam: 1.6, edge: .3 },

  aurora:  { energy: 'calm', L: { beam: .3, aurora: 1, dots: .25 },

const SCENE_KEYS = Object.keys(SCENES);
const LAYERS = ['beam', 'laser', 'dots', 'gobo', 'rays', 'tunnel', 'sky', 'spots', 'aurora', 'edge', 'blind', 'eq'];

const MAXF = 12;
const fixtures = [...Array(MAXF)].map((_, i) => ({
  i, u: 0, x: 0, tx: 0, on: i < 8 ? 1 : 0, ang: PI / 2, rnd: PI / 2, flash: 0, I: 0, col: [1, 1, 1], goboRot: rand(0, TAU),

// Đầu đèn trải đều trên giàn; đổi số đèn thì đầu đèn trượt tới chỗ mới
function layoutFixtures(snap) {
  fixtures.forEach(f => {
    if (f.i < nFix) {
      const k = nFix > 1 ? f.i / (nFix - 1) : .5;
      f.u = k * 2 - 1;
      f.tx = W * (0.08 + 0.84 * k);
    }
    if (snap) f.x = f.tx;
  });
}

const NSPOT = 6;
const spots = [...Array(NSPOT)].map((_, i) => ({ x: 0, y: 0, a: 1 + (i % 3) * .37, b: .8 + (i % 2) * .45, o: i * 1.7 }));

let sceneKey = 'sweep', sc = null;
const live = Object.fromEntries(LAYERS.map(k => [k, 0]));
live.beam = 1; live.spread = .045;
let laserMode = 'single', laserCol = LASER_COLORS[0], tunCols = [LASER_COLORS[0], LASER_COLORS[2]];
let time = 0, phase = 0, pulse = 0, hat = 0, loud = .6, loudLong = .5;

function enterScene(key) {
  sceneKey = key;
  const S = SCENES[key], B = S.beams;
  sc = { move: pick(B.moves), dim: pick(B.dims), color: pick(B.colors), spread: rand(...B.spread) };
  nFix = B.n; layoutFixtures(false);
  laserMode = pick(S.lasers || ['single', 'dual']);
  laserCol = pick(LASER_COLORS);

/* ================= Hạt: pháo giấy & tia lửa (canvas trên) ================= */
const parts = [];
const MAX_PARTS = 600;
function burstConfetti() {
  const pal = palette();
  for (let i = 0; i < 170 && parts.length < MAX_PARTS; i++) {
    parts.push({
      kind: 'c', x: rand(0, W), y: rand(-H * .35, -8), vx: rand(-40, 40), vy: rand(70, 170),
      rot: rand(0, TAU), vr: rand(-7, 7), w: rand(7, 13), h: rand(3, 6), col: pick(pal), sway: rand(0, TAU), life: 9,
    });
  }
}
function sparkBurst() {
  let ox, oy, spreadA, baseA;
  if (sceneKey === 'tunnel') { ox = W / 2; oy = H * .45; baseA = 0; spreadA = TAU; }
  else {
    const f = fixtures[Math.floor(Math.random() * nFix)];
    ox = f.x + Math.cos(f.ang) * 16; oy = trussY() + Math.sin(f.ang) * 16; baseA = f.ang - .5; spreadA = 1;
  }
  const c = sceneKey === 'tunnel' || sceneKey === 'laser' ? laserCol : [1, .85, .55];
  for (let i = 0; i < 16 && parts.length < MAX_PARTS; i++) {
    const a = baseA + Math.random() * spreadA, v = rand(260, 720);
    parts.push({ kind: 's', x: ox, y: oy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, col: c, life: rand(.5, 1), max: 1 });
  }
}
function drawParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.kind === 'c') {
      p.vy = Math.min(150, p.vy + 30 * dt);
      p.x += p.vx * dt + Math.sin(time * 3 + p.sway) * 26 * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
    } else {
      p.vy += 700 * dt; p.vx *= Math.exp(-dt * 1.5);
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    if (p.life <= 0 || p.y > H + 20) parts.splice(i, 1);
  }
  if (!parts.length) return;
  for (const p of parts) {
    if (p.kind !== 'c') continue;
    fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.rot);
    fctx.scale(Math.abs(Math.cos(p.rot * 1.3)) * .8 + .2, 1); // lật như giấy thật
    fctx.fillStyle = rgb(p.col, Math.min(1, p.life) * .95);
    fctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    fctx.restore();
  }
  fctx.globalCompositeOperation = 'lighter';
  fctx.lineCap = 'round';
  for (const p of parts) {

    fctx.strokeStyle = rgb(p.col, a);

    fctx.beginPath(); fctx.moveTo(p.x, p.y); fctx.lineTo(p.x - p.vx * .035, p.y - p.vy * .035); fctx.stroke();

/* ================= Quả cầu gương (canvas trên, độ phân giải gốc) =================
 * Vẽ bằng canvas 2D thay vì shader: lớp WebGL có thể tự giảm độ phân giải khi máy bận,
 * chùm đèn mềm thì không sao nhưng quả cầu có cạnh sắc sẽ bị nhòe. */
const BALL_ROWS = 12;
const fhash = (a, b, c = 0) => { const x = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453; return x - Math.floor(x); };
function drawBall(ballC) {
  if (!opt.ball) return;
  const cx = W / 2, cy = ballY(), R = ballR();
  const L = [-.45, -.55, .7]; // hướng sáng: trên, trái, phía trước
  const glints = [];
  const tint = (Math.max(live.dots, live.rays) * .9 + .25) * (.6 + .4 * pulse);
  // Quầng sáng quanh quả cầu
  fctx.globalCompositeOperation = 'lighter';
  const halo = fctx.createRadialGradient(cx, cy, R * .9, cx, cy, R * 2.2);
  halo.addColorStop(0, rgb(ballC, .28 * tint)); halo.addColorStop(1, rgb(ballC, 0));
  fctx.fillStyle = halo; fctx.beginPath(); fctx.arc(cx, cy, R * 2.2, 0, TAU); fctx.fill();
  fctx.globalCompositeOperation = 'source-over';
  // Thân + các mặt kính
  fctx.save();
  fctx.beginPath(); fctx.arc(cx, cy, R, 0, TAU); fctx.clip();
  fctx.fillStyle = '#121016'; fctx.fillRect(cx - R, cy - R, R * 2, R * 2);
  const pal = palette();
  for (let r = 0; r < BALL_ROWS; r++) {
    const lat0 = -PI / 2 + PI * r / BALL_ROWS, lat1 = lat0 + PI / BALL_ROWS, latm = (lat0 + lat1) / 2;
    const cnt = Math.max(6, Math.round(2 * BALL_ROWS * Math.cos(latm)));
    for (let c = 0; c < cnt; c++) {
      const lon0 = c / cnt * TAU + ballRot, lon1 = lon0 + TAU / cnt, lonm = (lon0 + lon1) / 2;
      const nx = Math.cos(latm) * Math.sin(lonm), ny = Math.sin(latm), nz = Math.cos(latm) * Math.cos(lonm);
      if (nz <= .03) continue; // mặt phía sau
      const pts = [[lat0, lon0], [lat0, lon1], [lat1, lon1], [lat1, lon0]].map(([la, lo]) =>
        [cx + R * Math.cos(la) * Math.sin(lo), cy - R * Math.sin(la)]);
      const mx = (pts[0][0] + pts[1][0] + pts[2][0] + pts[3][0]) / 4, my = (pts[0][1] + pts[1][1] + pts[2][1] + pts[3][1]) / 4;
      const ins = .82; // thu nhỏ ô để lộ đường ron tối giữa các mặt kính
      const diffuse = Math.max(0, -nx * L[0] + ny * -L[1] + nz * L[2]);
      const h = fhash(r, c);
      let v = 75 + 165 * diffuse * (.6 + .6 * h) + 35 * nz;
      // Mặt kính phản chiếu màu đèn
      let col = [v, v, v * 1.06];
      if (h > .45) {
        const tc = h > .85 ? ballC : pal[(r + c) % pal.length];
        const k = Math.min(.85, (.5 + .6 * tint) * (h - .3));
        col = col.map((x, i) => x * (1 - k) + 255 * tc[i] * k * 1.4);
      }
      // Lấp lánh: vài mặt kính lóe trắng, đổi theo thời gian
      const tw = fhash(r, c, Math.floor(time * 6 + h * 6));
      if (tw > .962 - .03 * pulse) { col = [255, 255, 255]; glints.push([mx, my, nz]); }
      fctx.fillStyle = `rgb(${Math.min(255, col[0]) | 0},${Math.min(255, col[1]) | 0},${Math.min(255, col[2]) | 0})`;
      fctx.beginPath();
      pts.forEach(([x, y], i) => { const px = mx + (x - mx) * ins, py = my + (y - my) * ins; i ? fctx.lineTo(px, py) : fctx.moveTo(px, py); });
      fctx.closePath(); fctx.fill();
    }
  }
  // Tối dần ở rìa + điểm bóng loáng
  const shade = fctx.createRadialGradient(cx - R * .25, cy - R * .3, R * .2, cx, cy, R);
  shade.addColorStop(0, 'rgba(0,0,0,0)'); shade.addColorStop(.8, 'rgba(0,0,0,.06)'); shade.addColorStop(1, 'rgba(0,0,0,.4)');
  fctx.fillStyle = shade; fctx.fillRect(cx - R, cy - R, R * 2, R * 2);
  const spec = fctx.createRadialGradient(cx - R * .38, cy - R * .42, 0, cx - R * .38, cy - R * .42, R * .45);
  spec.addColorStop(0, 'rgba(255,255,255,.55)'); spec.addColorStop(1, 'rgba(255,255,255,0)');
  fctx.fillStyle = spec; fctx.fillRect(cx - R, cy - R, R * 2, R * 2);
  fctx.restore();
  fctx.strokeStyle = 'rgba(0,0,0,.6)'; fctx.lineWidth = 1.2;
  fctx.beginPath(); fctx.arc(cx, cy, R, 0, TAU); fctx.stroke();
  // Tia lấp lánh hình sao
  fctx.globalCompositeOperation = 'lighter';
  for (const [x, y, z] of glints) {
    const s = R * (.26 + .26 * z);
    const g = fctx.createRadialGradient(x, y, 0, x, y, s * .5);
    g.addColorStop(0, 'rgba(255,255,255,.9)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    fctx.fillStyle = g; fctx.beginPath(); fctx.arc(x, y, s * .5, 0, TAU); fctx.fill();
    fctx.strokeStyle = 'rgba(255,255,255,.75)'; fctx.lineWidth = 1.3;
    fctx.beginPath(); fctx.moveTo(x - s, y); fctx.lineTo(x + s, y); fctx.moveTo(x, y - s); fctx.lineTo(x, y + s); fctx.stroke();
  }
  fctx.globalCompositeOperation = 'source-over';
}

/* ================= Cột sóng LED ở đáy màn hình ================= */
const EQN = 40, EQ_CELLS = 16;
const eqVal = new Float32Array(EQN), eqPeak = new Float32Array(EQN);
let eqEdges = [];
function eqBands() {
  const bin = SR / FN;
  if (eqEdges.length !== EQN + 1 || eqEdges.bin !== bin) {
    eqEdges = [];
    for (let b = 0; b <= EQN; b++) eqEdges.push(Math.max(1, Math.round(40 * Math.pow(12000 / 40, b / EQN) / bin)));
    eqEdges.bin = bin;
  }
}
function drawEq(dt) {
  if (live.eq < .02) return;
  eqBands();
  const fresh = performance.now() - lastPcm < 400;
  for (let b = 0; b < EQN; b++) {
    let v = 0;
    if (fresh) {
      const lo = eqEdges[b], hi = Math.min(FN / 2 - 1, Math.max(lo, eqEdges[b + 1] - 1));
      for (let i = lo; i <= hi; i++) v += mags[i];
      v /= hi - lo + 1;
      v = Math.max(0, Math.min(1, (v - .32) / .6));
    } else v = .3 + .6 * pulse * Math.pow(1 - b / EQN, .8) * (.7 + .3 * Math.sin(time * 6 + b)) + .15 * Math.sin(time * 2.3 + b * .45); // không có nhạc: nhảy theo nhịp giả
    eqVal[b] = Math.max(v, eqVal[b] - dt * 1.8);
    eqPeak[b] = Math.max(eqVal[b], eqPeak[b] - dt * .45);
  }
  const pal = palette(), c0 = pal[colorShift % pal.length], c1 = pal[(colorShift + 1) % pal.length];
  const colW = W / EQN, cellH = Math.max(5, Math.min(15, H * .3 / EQ_CELLS)), gap = 2, a = live.eq;
  fctx.globalCompositeOperation = 'lighter';
  for (let b = 0; b < EQN; b++) {
    const x = b * colW + 2, w = colW - 4, lit = Math.round(eqVal[b] * EQ_CELLS);
    for (let c = 0; c < lit; c++) {
      const k = c / EQ_CELLS;
      const col = [lerp(c0[0], c1[0], k), lerp(c0[1], c1[1], k), lerp(c0[2], c1[2], k)];
      fctx.fillStyle = rgb(col, a * (.55 + .4 * k));
      fctx.fillRect(x, H - 6 - (c + 1) * (cellH + gap), w, cellH);
    }
    const pk = Math.round(eqPeak[b] * EQ_CELLS);
    if (pk > 0) { fctx.fillStyle = `rgba(255,255,255,${a * .8})`; fctx.fillRect(x, H - 6 - pk * (cellH + gap) - 3, w, 2); }
  }
  fctx.globalCompositeOperation = 'source-over';
}

/* ================= Vòng vẽ ================= */
const beamA = new Float32Array(48), beamP = new Float32Array(48), beamC = new Float32Array(36);
const spotU = new Float32Array(24), palU = new Float32Array(18);
let last = performance.now(), perfAcc = 0, perfN = 0;
let target = 0, master = 0, running = false;

function frame(now) {
  // Giới hạn khung hình (tiết kiệm CPU khi chọn 30)
  if (opt.fps < 60 && now - last < 1000 / opt.fps - 4) { requestAnimationFrame(frame); return; }
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  time += dt;

  // Hiện/ẩn dần
  master = target > master ? Math.min(target, master + dt / 0.3) : Math.max(target, master - dt / 0.35);
  if (target === 0 && master <= 0) {
    running = false;
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    rctx.clearRect(0, 0, W, H); fctx.clearRect(0, 0, W, H);
    parts.length = 0;
    window.disco.fadedOut();
    return;
  }

  // Không có nhạc (chế độ "Luôn bật") hoặc lâu không bắt được nhịp: tự giữ nhịp nhẹ
  if (!music || now - lastBeatMs > 2500) {
    simAcc += dt;
    const iv = 60 / curBpm;
    if (simAcc >= iv / 2 && simAcc - dt < iv / 2) hat = .6;
    while (simAcc >= iv) { simAcc -= iv; beat(beatCount % 4 === 3 ? .8 : .55); }
    if (!music) loud = .5;
  } else simAcc = 0;

  // Làm mượt độ sáng các lớp về giá trị của cảnh hiện tại
  const S = SCENES[sceneKey], k = 1 - Math.exp(-dt * 1.8);
  for (const key of LAYERS) {
    let tv = S.L[key] || 0;
    if ((key === 'dots' || key === 'rays') && !opt.ball) tv = 0;
    live[key] = lerp(live[key], tv, k);
  }
  live.spread = lerp(live.spread, sc.spread, k);
  live.gobo = lerp(live.gobo, S.L.gobo || 0, k);

  phase += dt * S.beams.speed * TAU * curBpm / 480;
  pulse *= Math.exp(-dt * 5);
  hat *= Math.exp(-dt * 14);
  blindFlash *= Math.exp(-dt * 9);
  ballRot += dt * .32;
  tunRot += dt * (.35 + 1.4 * pulse);
  spotRot += dt * (.9 + 1.5 * pulse);

  // Đèn rọi gobo chạy theo đường cong Lissajous
  spots.forEach(s => {
    s.x = W * (.5 + .38 * Math.sin(phase * .35 * s.a + s.o));
    s.y = H * (.58 + .28 * Math.sin(phase * .3 * s.b + s.o * 1.3));
  });

  const py = trussY();
  const motor = 1 - Math.exp(-dt * 6.5), ck = 1 - Math.exp(-dt * 9), slide = 1 - Math.exp(-dt * 4);
  fixtures.forEach(f => {
    const active = f.i < nFix;
    f.on += ((active ? 1 : 0) - f.on) * slide;
    f.x += (f.tx - f.x) * slide;
    f.flash *= Math.exp(-dt * 6.5);
    f.ang += (targetAngle(f) - f.ang) * motor;
    const tc = targetColor(f);
    for (let c = 0; c < 3; c++) f.col[c] += (tc[c] - f.col[c]) * ck;
    let d = 1;
    if (sc.dim === 'wave') d = .2 + .8 * Math.pow(.5 + .5 * Math.sin(phase * 2 - f.i * .9), 2);
    else if (sc.dim === 'chase') d = .35 + .65 * f.flash;
    f.I = live.beam * d * f.on * (.28 + .35 * loud + .75 * f.flash);
    f.goboRot += dt * (1.2 + (f.i % 3) * .5) * (f.i % 2 ? 1 : -1);
    const dx = Math.cos(f.ang), dy = Math.sin(f.ang);
    beamA.set([f.x + dx * 16, py + dy * 16, f.ang, f.I], f.i * 4);
    beamP.set([live.spread, live.gobo, f.goboRot, 0], f.i * 4);
    beamC.set(f.col, f.i * 3);
  });

  // Laser quạt
  const lI = live.laser * (.55 + .45 * Math.max(hat, pulse));
  const ly = opt.truss ? 41 : -2;
  const sweep = Math.sin(phase * 1.3);
  const lp = [.95 + .5 * Math.sin(phase * .7), 12, .015 + .03 * pulse];
  let L1, L2;
  if (laserMode === 'dual') {
    const a = PI / 2 - .55 + .35 * sweep;
    L1 = [W * .03, ly, a, lI]; L2 = [W * .97, ly, PI - a, lI];
    lp[0] *= .7;
  } else {
    L1 = [W / 2, ly, PI / 2 + .5 * sweep, lI]; L2 = [0, 0, 0, 0];
  }
  // Đường hầm laser
  const tI = live.tunnel * (.55 + .45 * Math.max(hat, pulse)), tn = 18;
  const T1 = [W / 2, H * .45, tunRot, tI], T2 = [W / 2, H * .45, -tunRot * 1.3 + .13, tI * .8];
  // Bầu trời laser
  const sky = [live.sky * (.6 + .4 * Math.max(hat, pulse)), .2 + .05 * Math.sin(phase * .3), 40 + 30 * pulse, .9 + curBpm / 240];

  const pal = palette();
  for (let i = 0; i < 6; i++) palU.set(pal[(i + colorShift) % pal.length], i * 3);
  for (let i = 0; i < NSPOT; i++) {
    const s = spots[i];
    spotU.set([s.x, s.y, H * .1 * (1 + .18 * pulse), live.spots * (.55 + .45 * fixtures[i % MAXF].flash + .2 * pulse)], i * 4);
  }

  const c0 = fixtures[0].col, cN = fixtures[Math.max(0, nFix - 1)].col;
  const ballC = [(c0[0] + cN[0]) / 2, (c0[1] + cN[1]) / 2, (c0[2] + cN[2]) / 2];
  const wk = (.05 + .1 * loud + .14 * pulse) * Math.max(.4, live.beam) * .35;
  const wash = [(c0[0] + cN[0]) * wk, (c0[1] + cN[1]) * wk, (c0[2] + cN[2]) * wk];
  const ec = pal[colorShift % pal.length], eI = live.edge * (.3 + .7 * pulse);

  let strobe = 0;
  if (strobeT > 0) { strobeT -= dt; if (opt.strobe && Math.floor(strobeT * 22) % 2 === 0) strobe = .4; }

  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform2f(U.uRes, glc.width, glc.height);
  gl.uniform2f(U.uView, W, H);
  gl.uniform1f(U.uTime, time);
  gl.uniform1f(U.uFog, opt.fog);
  gl.uniform1f(U.uExposure, .5 + 1.5 * opt.bright);
  gl.uniform1f(U.uStrobe, strobe);
  gl.uniform1f(U.uMaster, master);
  gl.uniform1i(U.uNB, MAXF);
  gl.uniform4fv(U['uBeam[0]'], beamA);
  gl.uniform4fv(U['uBeamP[0]'], beamP);
  gl.uniform3fv(U['uBeamC[0]'], beamC);
  gl.uniform4fv(U.uL1, L1); gl.uniform4fv(U.uL2, L2);
  gl.uniform3fv(U.uLP, lp); gl.uniform3fv(U.uLC, laserCol);
  gl.uniform4fv(U.uT1, T1); gl.uniform4fv(U.uT2, T2);
  gl.uniform3f(U.uTP, TAU * (1 - 1 / tn), tn, .01);
  gl.uniform3fv(U.uTC1, tunCols[0]); gl.uniform3fv(U.uTC2, tunCols[1]);
  gl.uniform4fv(U.uSky, sky); gl.uniform3fv(U.uSkyC, laserCol);
  gl.uniform4f(U.uBall, W / 2, ballY(), ballR(), ballRot);
  gl.uniform3f(U.uBallI, 0, live.dots * (.6 + .3 * loud + .4 * pulse), live.rays * (.5 + .5 * pulse));
  gl.uniform3fv(U.uBallC, ballC);
  gl.uniform4fv(U['uSpot[0]'], spotU);
  gl.uniform1f(U.uSpotRot, spotRot);
  gl.uniform3fv(U['uPal[0]'], palU);
  gl.uniform2f(U.uAur, live.aurora * (.6 + .25 * loud + .3 * pulse), colorShift % 6);
  gl.uniform4f(U.uEdge, ec[0], ec[1], ec[2], eI);
  gl.uniform3f(U.uBlind, live.blind * (.15 + blindFlash), blindY(), BLINDERS);
  gl.uniform3fv(U.uWash, wash);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  if (!window.__dvtStatus) { const err = gl.getError(); window.__dvtStatus = err ? 'error: WebGL ' + err : 'ok'; }

  rig.style.opacity = master.toFixed(3);
  drawRig();
  fxc.style.opacity = master.toFixed(3);
  fctx.clearRect(0, 0, W, H);
  drawEq(dt);
  drawBall(ballC);
  drawParts(dt);

  perfAcc += dt; perfN++;
  if (perfN >= 90) {
    const avg = perfAcc / perfN;
    if (avg > 1.4 / opt.fps && quality > .6) { quality = Math.max(.6, quality * .85); resize(); }
    else if (avg < .87 / opt.fps && quality < 1) { quality = Math.min(1, quality * 1.08); resize(); }
    perfAcc = 0; perfN = 0;
  }
  requestAnimationFrame(frame);
}

/* ================= Nhận lệnh từ main ================= */
window.disco.onSettings(s => {
  const prev = opt.scene;
  Object.assign(opt, s);
  // Chạy thử trên máy CI (không GPU, vẽ bằng CPU): nửa độ phân giải cho nhanh
  if (s.smoke && quality > .5) { quality = .5; resize(); }
  if (opt.scene !== prev) enterScene(opt.scene === 'auto' ? sceneKey : opt.scene);
});
window.disco.onVisible(v => {
  target = v ? 1 : 0;
  if (v && !running) { running = true; last = performance.now(); requestAnimationFrame(frame); }
});
addEventListener('resize', resize);

resize();
enterScene('sweep');

</script>

<script>
(function () {

      win1n: "SmartScreen warns because the installer isn’t code-signed yet.",
      win2: "Click the disco ball next to the clock to open the control panel. Play music and the lights come on.",
      macReq: "macOS 13 or later. One app for both Apple Silicon and Intel.",
      mac1: "Open the .dmg and drag Disco Lights into Applications.",
      mac2: "First launch: in Applications, right-click the app, choose Open, then Open again.",
      mac2n: "The app isn’t signed by Apple yet. If macOS says it’s damaged, run this in Terminal:",
      mac3: "When macOS asks, allow screen and system audio recording. It’s the only way macOS lets an app hear what’s playing; nothing is recorded.",
      linReq: "Ubuntu 22.04 or later, or another Debian-based distro, amd64.",
      lin1: "Run the install command in the folder with the file:",
      lin2: "Open Disco Lights from your app list.",
      lin2n: "Needs an X11 session. On Wayland, pick “Ubuntu on Xorg” at the login screen.",
      copy: "Copy", copied: "Copied", toast: "Copied to clipboard",
      copyFail: "Couldn’t copy automatically. The command is selected, press Ctrl+C (⌘C on Mac).",
      scenesH: "12 scenes that follow the music",
      scenesSub: "Calm scenes for slow songs, intense ones for bangers. When the drop hits, the lights explode with confetti.",
      scenesNote: "Click a scene to watch it live at the top of the page.",
      featH: "Runs in the background, stays out of your way",
      f1: "Music only", f1d: "It recognizes music in about 2.5 seconds. Talking videos and notification sounds don’t turn the lights on.",
      f2: "Click straight through", f2d: "The lights sit on top of your screen, but your mouse and keyboard keep working on the windows underneath.",
      f3: "Control panel in the tray", f3d: "Click the disco ball to pick a scene, colors, brightness and haze. English and Vietnamese interface.",
      f4: "Quick off switch", f4d: "Turn the lights on or off with", f4m: "(macOS: ⌃⌥D).",
      privH: "Your audio never leaves your computer",
      p1: "Beat only, no recording", p1d: "The app measures the loudness and beat of what’s playing to drive the lights. Nothing is recorded, stored or sent.",
      p2: "No internet needed", p2d: "No account, no ads, no usage analytics.",
      p3: "This page doesn’t track you", p3d: "No analytics tools. Download counts come straight from GitHub."
    }
  };

  /* Ngày theo ngôn ngữ */
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var dm = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(R.date || "");
  var dateEn = dm ? MON[+dm[2] - 1] + " " + (+dm[1]) + ", " + dm[3] : R.date;

  /* Hệ điều hành của người xem */
  var ua = navigator.userAgent || "", plat = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || "";
  var mobile = (navigator.userAgentData && navigator.userAgentData.mobile) || /Android|iPhone|iPad|iPod|Mobile/i.test(ua) || (/Mac/.test(plat) && navigator.maxTouchPoints > 1);
  var myOs = /Win/i.test(plat) ? "windows" : /Mac/i.test(plat) ? "macos" : /Linux|X11|CrOS/i.test(plat + ua) ? "linux" : "windows";
  if (mobile) root.classList.add("mobile");

  var lang = root.lang === "en" ? "en" : "vi";
  function t(key, vars) {
    var s = (T[lang] && T[lang][key]) || T.vi[key] || "";
    return s.replace(/\{(\w+)\}/g, function (_, k) { return vars && k in vars ? vars[k] : ""; });
  }
  var base = "https://github.com/" + R.repo + "/releases/download/v" + R.version + "/";

  function render() {
    root.lang = lang;
    var vars = { ver: R.version, date: lang === "en" ? dateEn : R.date };
    doc.querySelectorAll("[data-t]").forEach(function (el) {
      var os = el.dataset.os === "auto" ? myOs : el.dataset.os;
      el.textContent = t(el.dataset.t, Object.assign({ os: OSNAME[os] }, vars));
    });
    doc.querySelectorAll("[data-ta]").forEach(function (el) { el.setAttribute("aria-label", t(el.dataset.ta)); });
    doc.querySelectorAll("[data-fileline]").forEach(function (el) {
      var b = R.builds[el.dataset.fileline === "auto" ? myOs : el.dataset.fileline];
      el.textContent = t("fileline", { file: b.file, size: b.size });
    });
    doc.querySelectorAll(".lang button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.lang === lang)); });
    doc.title = lang === "en" ? "Download Disco Lights " + R.version + " for Windows, macOS, Linux" : "Tải Disco Lights " + R.version + " cho Windows, macOS, Linux";
    renderScenes(); renderCounts(); updateNow();
  }

  /* Link tải */
  doc.querySelectorAll("[data-href]").forEach(function (el) { el.href = base + R.builds[el.dataset.href].file; });
  doc.getElementById("mainBtn").href = base + R.builds[myOs].file;
  doc.getElementById("aptCmd").textContent = "sudo apt install ./" + R.builds.linux.file;
  var card = doc.querySelector('[data-card="' + myOs + '"]');
  if (card && !mobile) card.classList.add("mine");

  /* Lưới các cảnh */
  function renderScenes() {
    var g = doc.getElementById("sceneGrid");
    g.innerHTML = "";
    SCENES.forEach(function (k) {
      var f = doc.createElement("figure"); f.className = "scene";
      var img = doc.createElement("img"); img.src = IMG[k]; img.alt = t("sc_" + k); img.loading = "lazy"; img.width = 800; img.height = 450;
      var cap = doc.createElement("figcaption"); cap.textContent = t("sc_" + k);
      var b = doc.createElement("button"); b.type = "button"; b.setAttribute("aria-label", t("sc_" + k));
      b.addEventListener("click", function () { setScene(k); window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); });
      f.append(img, cap, b); g.appendChild(f);
    });
  }

  /* Đếm lượt tải từ GitHub */
  var counts = null;
  function renderCounts() {
    doc.querySelectorAll("[data-count]").forEach(function (el) {
      var n = counts && counts[el.dataset.count];
      el.textContent = n ? t("count", { n: n.toLocaleString(lang === "en" ? "en-US" : "vi-VN") }) : "";
    });
  }
  fetch("https://api.github.com/repos/" + R.repo + "/releases?per_page=100", { headers: { Accept: "application/vnd.github+json" } })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (rels) {
      counts = { windows: 0, macos: 0, linux: 0 };
      rels.forEach(function (rel) { (rel.assets || []).forEach(function (a) {
        if (/\.sha256$/.test(a.name)) return;
        if (/\.exe$/.test(a.name)) counts.windows += a.download_count;
        else if (/\.dmg$/.test(a.name)) counts.macos += a.download_count;
        else if (/\.deb$/.test(a.name)) counts.linux += a.download_count;
      }); });
      renderCounts();
    }).catch(function () {});

  /* Sao chép lệnh */
  var toast = doc.getElementById("toast"), toastTimer;
  function showToast(msg) { toast.textContent = msg; toast.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 2200); }
  doc.querySelectorAll("[data-copy]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var code = btn.parentNode.querySelector("code"), text = code.textContent;
      function ok() { btn.textContent = t("copied"); showToast(t("toast")); setTimeout(function () { btn.textContent = t("copy"); }, 1600); }
      function fail() { var r = doc.createRange(); r.selectNodeContents(code); var s = getSelection(); s.removeAllRanges(); s.addRange(r); showToast(t("copyFail")); }
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, fail); else fail();
    });
  });

  /* Đổi ngôn ngữ */
  doc.querySelectorAll(".lang button").forEach(function (b) {
    b.addEventListener("click", function () {
      lang = b.dataset.lang;
      try { localStorage.setItem("dl-site-lang", lang); } catch (e) {}
      render();
    });
  });

  /* Thanh đầu trang có nền khi cuộn qua phần đầu */
  var top = doc.getElementById("top");
  function onScroll() { top.classList.toggle("solid", window.scrollY > window.innerHeight * .6); }
  addEventListener("scroll", onScroll, { passive: true }); onScroll();

  /* ===== Đèn thật của ứng dụng ở phần đầu trang =====
     Chỉ chạy trên máy tính có WebGL và không bật giảm chuyển động; còn lại hiện ảnh tĩnh.
     Không chớp trắng (strobe) trên trang công khai. Dừng vẽ khi cuộn khỏi phần đầu. */
  var cfg = { scene: "auto", palette: "neon", bright: .75, fog: .65, truss: false, ball: true, strobe: false, fps: 60, musicOnly: false };
  var live = false;
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var canGL = (function () { try { return !!doc.createElement("canvas").getContext("webgl"); } catch (e) { return false; } })();
  doc.querySelector(".hero").style.setProperty("--hero-still", "url(" + IMG.drop + ")");
  if (!mobile && !reduce && canGL) {
    try {
      var s = doc.createElement("script");
      s.textContent = doc.getElementById("engine").textContent;
      doc.body.appendChild(s);
      live = typeof enterScene === "function" && !/^error/.test(window.__dvtStatus || "");
    } catch (e) { live = false; }
  }
  function setScene(k) {
    if (!live) return;
    cfg.scene = k; __cb.settings(Object.assign({}, cfg));
    doc.querySelectorAll("#chips [data-scene]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.scene === k)); });
    updateNow();
  }
  function updateNow() {
    var el = doc.getElementById("nowScene");
    if (live && typeof sceneKey === "string") el.textContent = t("sc_" + sceneKey);
  }
  if (live) {
    root.classList.add("live");
    curBpm = 124;
    __cb.settings(Object.assign({}, cfg));
    var heroEl = doc.querySelector(".hero");
    new IntersectionObserver(function (es) { __cb.visible(es[0].isIntersecting); }, { threshold: .05 }).observe(heroEl);
    doc.querySelectorAll("#chips [data-scene]").forEach(function (b) { b.addEventListener("click", function () { setScene(b.dataset.scene); }); });
    doc.getElementById("dropBtn").addEventListener("click", function () { lastDrop = performance.now(); enterScene("drop"); updateNow(); });
    setInterval(updateNow, 400);
    // Lỗi WebGL lúc vẽ khung đầu: quay về ảnh tĩnh
    setTimeout(function () { if (/^error/.test(window.__dvtStatus || "")) { root.classList.remove("live"); __cb.visible(false); } }, 1500);
  }

  render();
})();
</script>
</body>
</html>
